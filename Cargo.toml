[package]
name = "macsync"
version = "0.1.0"
edition = "2024"
description = "Menu-bar app that keeps dated, hard-linked rsync snapshots of folders"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
croner = "4.0.1"
dispatch2 = "0.3.1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
libc = "0.2.190"
notify-rust = { version = "4.18.2", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSThread"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tray-icon = "0.26.1"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
# Same version eframe uses; needed for the macOS activation policy (no Dock icon).
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "snapshot", "wgpu"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
